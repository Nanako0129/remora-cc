# CodeRabbit configuration.
# Schema: https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
#
# Every instruction below restates a rule this repository already writes down in
# CONTRIBUTING.md. Nothing here is a new policy.

reviews:
  auto_review:
    # Default is 5: after five reviewed commits CodeRabbit silently stops
    # auto-reviewing, and a poller then reads that as a timeout rather than a
    # pause. A fix loop on a contested PR passes five rounds easily.
    auto_pause_after_reviewed_commits: 20

  path_instructions:
    - path: "**"
      instructions: |
        Scope (CONTRIBUTING.md). remora stays intentionally small. A change
        should strengthen session-scoped routing, portability, diagnostics,
        documentation or tests without turning the launcher into a proxy,
        account manager, GUI, or persistent Claude configuration manager.

        Out of scope, explicitly: editing ~/.claude, bundling OAuth tokens,
        reimplementing gateway translation, shell-evaluated secret commands.
        Flag a change that crosses one of those lines even when the code is
        clean.

    - path: "{tests/**,test/**}"
      instructions: |
        Tests must not require a real gateway, modify the developer's Claude
        configuration, or print secrets. An integration that needs a live
        provider belongs behind an explicit opt-in flag and must redact
        authentication and response bodies by default.

        A PR touching launcher or installer behaviour needs a regression test
        for it.

    - path: "{README.md,README.zh-TW.md,docs/**}"
      instructions: |
        Keep the English and Traditional Chinese setup instructions aligned when
        a change alters user-visible behaviour. A documentation change that
        updates one language and not the other leaves the two disagreeing about
        what the tool does.

knowledge_base:
  code_guidelines:
    filePatterns:
      - "CONTRIBUTING.md"
      - "README.md"
